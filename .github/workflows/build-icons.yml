name: Gerar icones PWA

on:
  push:
    branches: [main]
    paths:
      - 'icons/icon-source.jpg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --quiet pillow
      - name: Preparar icones a partir da arte aprovada
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('icons/icon-source.jpg')
          assert source.is_file(), 'Icone de origem nao encontrado'
          image = Image.open(source).convert('RGB')
          for size in (180, 192, 512):
              output = Path(f'icons/icon-{size}.png')
              image.resize((size,size),Image.Resampling.LANCZOS).save(output,optimize=True)
              print(output, output.stat().st_size, 'bytes')
          PY
      - name: Publicar icones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/icon-180.png icons/icon-192.png icons/icon-512.png
          if git diff --cached --quiet; then
            echo 'Icones ja estao atualizados.'
          else
            git commit -m 'assets(pwa): gera icones ARCANA para iOS e Android'
            git push
          fi
